<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="VEK" />
  <meta name="theme-color" content="#2A2F25" />
  <title>VEK — Veguel Imóveis</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      min-height: 100vh;
      min-height: 100dvh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #2A2F25;
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
      -webkit-font-smoothing: antialiased;
      padding: 24px 20px;
      padding-top: calc(24px + env(safe-area-inset-top));
      padding-bottom: calc(24px + env(safe-area-inset-bottom));
    }

    /* Background pattern subtil */
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background:
        radial-gradient(ellipse 60% 50% at 20% 30%, rgba(191,204,182,0.04) 0%, transparent 70%),
        radial-gradient(ellipse 50% 60% at 80% 70%, rgba(63,71,56,0.5) 0%, transparent 70%);
      pointer-events: none;
    }

    .card {
      background: #3F4738;
      border: 1px solid rgba(191,204,182,0.16);
      border-radius: 22px;
      padding: 48px 44px;
      width: 100%;
      max-width: 390px;
      text-align: center;
      position: relative;
      animation: cardIn 0.3s ease;
    }
    @keyframes cardIn {
      from { opacity: 0; transform: translateY(16px); }
      to   { opacity: 1; transform: translateY(0);    }
    }

    .brand {
      margin-bottom: 32px;
    }
    .brand-logo {
      font-size: 2.2rem;
      font-weight: 700;
      color: #F0F2ED;
      letter-spacing: 5px;
      text-transform: uppercase;
      line-height: 1;
      margin-bottom: 8px;
    }
    .brand-line {
      width: 32px;
      height: 2px;
      background: rgba(191,204,182,0.4);
      margin: 10px auto;
      border-radius: 1px;
    }
    .brand-sub {
      color: rgba(191,204,182,0.65);
      font-size: 0.72rem;
      font-weight: 500;
      letter-spacing: 2px;
      text-transform: uppercase;
    }

    .error-msg {
      background: rgba(239,68,68,0.1);
      border: 1px solid rgba(239,68,68,0.28);
      color: #F87171;
      padding: 10px 14px;
      border-radius: 9px;
      font-size: 0.84rem;
      margin-bottom: 20px;
      text-align: left;
    }

    label {
      display: block;
      text-align: left;
      font-size: 0.68rem;
      color: rgba(191,204,182,0.6);
      text-transform: uppercase;
      letter-spacing: 1.3px;
      margin-bottom: 6px;
      font-weight: 600;
    }

    input {
      width: 100%;
      padding: 12px 14px;
      background: rgba(42,47,37,0.7);
      border: 1px solid rgba(191,204,182,0.18);
      border-radius: 10px;
      color: #F0F2ED;
      font-size: 16px; /* impede zoom automático no iOS */
      font-family: 'Inter', sans-serif;
      font-weight: 400;
      margin-bottom: 18px;
      outline: none;
      transition: border-color .2s, background .2s;
      -webkit-appearance: none;
    }
    input:focus {
      border-color: rgba(191,204,182,0.5);
      background: rgba(42,47,37,0.9);
    }
    input::placeholder { color: rgba(191,204,182,0.3); }

    button[type="submit"] {
      width: 100%;
      padding: 14px;
      background: #BFCCB6;
      color: #2A2F25;
      border: none;
      border-radius: 10px;
      font-size: 0.92rem;
      font-weight: 600;
      font-family: 'Inter', sans-serif;
      letter-spacing: 0.3px;
      cursor: pointer;
      transition: background .15s, transform .1s;
      margin-top: 4px;
    }
    button[type="submit"]:hover  { background: #D0DAC9; }
    button[type="submit"]:active { transform: scale(0.98); }

    .footer-note {
      margin-top: 22px;
      font-size: 0.7rem;
      color: rgba(191,204,182,0.3);
      letter-spacing: 0.5px;
    }

    @media (max-width: 420px) {
      .card { padding: 36px 24px; border-radius: 18px; }
      .brand-logo { font-size: 1.8rem; }
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="brand">
      <div class="brand-logo">VEK</div>
      <div class="brand-line"></div>
      <div class="brand-sub">Veguel Imóveis</div>
    </div>

    {% if error %}
    <div class="error-msg">{{ error }}</div>
    {% endif %}

    <form method="POST">
      <label>Seu nome</label>
      <input type="text" name="nome" placeholder="Ex: Gabriel" required autocomplete="off" />

      <label>Senha de acesso</label>
      <input type="password" name="senha" placeholder="••••••••" required />

      <button type="submit">Entrar</button>
    </form>

    <div class="footer-note">Calendario compartilhado · Veguel</div>
  </div>
</body>
</html>
